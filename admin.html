<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة الطلبات</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7f6;color:#333;font-family:Tahoma,Arial,sans-serif}
    .wrap{max-width:1200px;margin:25px auto;padding:0 15px}
    .top{background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 15px rgba(0,0,0,.07);margin-bottom:15px}
    h1{margin:0 0 8px;font-size:22px}
    .sub{color:#777;font-size:12px}
    .stats{display:flex;gap:12px;margin-top:15px;flex-wrap:wrap}
    .stat{background:#eef5f1;border-radius:9px;padding:12px 18px;min-width:150px}
    .stat strong{display:block;font-size:22px;color:#416d5d}
    .stat span{font-size:11px;color:#666}
    .table-box{background:#fff;border-radius:12px;overflow:auto;box-shadow:0 3px 15px rgba(0,0,0,.07)}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th,td{padding:12px 10px;border-bottom:1px solid #eee;text-align:right;font-size:12px;vertical-align:top}
    th{background:#f8faf9;font-weight:700}
    .badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf5ef;color:#3d6d59;font-size:10px}
    .actions a,.actions button{display:inline-block;margin:2px;padding:6px 9px;border:1px solid #d7ddd9;border-radius:6px;background:#fff;color:#416d5d;text-decoration:none;font-family:inherit;font-size:10px;cursor:pointer}
    .actions a:hover{background:#eef5f1}
    .danger{color:#a83d3d!important}
    .empty{padding:35px;text-align:center;color:#888}
    .login{max-width:420px;margin:80px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 3px 15px rgba(0,0,0,.08)}
    input{width:100%;height:40px;margin:7px 0 12px;padding:0 10px;border:1px solid #ddd;border-radius:7px;font-family:inherit}
    button.main{width:100%;height:42px;border:0;border-radius:8px;background:#4f7f6d;color:#fff;font-family:inherit;cursor:pointer}
    .error{color:#a83d3d;font-size:11px}
    @media(max-width:700px){.wrap{margin:10px auto}.top{padding:15px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const app = document.getElementById("app");
let token = localStorage.getItem("adminToken");

function loginPage(error="") {
  app.innerHTML = `
    <div class="login">
      <h2>لوحة إدارة الطلبات</h2>
      <p class="sub">سجّل الدخول لمشاهدة الطلبات والمرفقات.</p>
      ${error ? `<p class="error">${error}</p>` : ""}
      <label>كلمة المرور</label>
      <input id="password" type="password" placeholder="كلمة مرور الإدارة">
      <button class="main" onclick="login()">دخول</button>
    </div>`;
  document.getElementById("password").addEventListener("keydown", e => {
    if(e.key === "Enter") login();
  });
}

async function login() {
  const password = document.getElementById("password").value;
  const r = await fetch("/api/admin/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password})
  });
  const data = await r.json();
  if(!r.ok) return loginPage(data.message || "بيانات الدخول غير صحيحة");
  token = data.token;
  localStorage.setItem("adminToken", token);
  dashboard();
}

async function dashboard() {
  const r = await fetch("/api/applications", {
    headers: {Authorization:"Bearer " + token}
  });
  if(r.status === 401) {
    localStorage.removeItem("adminToken");
    token = null;
    return loginPage("انتهت الجلسة.");
  }
  const data = await r.json();
  renderDashboard(data.applications || []);
}

function renderDashboard(applications) {
  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <h1>لوحة إدارة طلبات التوظيف</h1>
        <div class="sub">عرض الطلبات والمرفقات المحفوظة في قاعدة البيانات.</div>
        <div class="stats">
          <div class="stat"><strong>${applications.length}</strong><span>إجمالي الطلبات</span></div>
          <div class="stat"><strong>${applications.filter(x => x.status === "new").length}</strong><span>طلبات جديدة</span></div>
        </div>
      </div>
      <div class="table-box">
        ${applications.length ? `
        <table>
          <thead><tr>
            <th>رقم</th><th>الاسم</th><th>الوظيفة</th><th>الجوال</th><th>المدينة</th>
            <th>المؤهل</th><th>الخبرة</th><th>التاريخ</th><th>المرفقات</th><th>إجراء</th>
          </tr></thead>
          <tbody>
          ${applications.map(x => `
            <tr>
              <td>#${x.id}</td>
              <td>${escapeHtml(x.fullName)}<br><small>${escapeHtml(x.email)}</small></td>
              <td>${escapeHtml(x.job)}</td>
              <td>${escapeHtml(x.phone)}</td>
              <td>${escapeHtml(x.city)}</td>
              <td>${escapeHtml(x.education)}<br>${escapeHtml(x.major || "بدون تخصص")}</td>
              <td>${escapeHtml(String(x.experience || 0))} سنة</td>
              <td>${new Date(x.createdAt).toLocaleString("ar-SA")}</td>
              <td class="actions">
                ${x.idFile ? `<a href="/api/files/${x.idFile}?token=${encodeURIComponent(token)}" target="_blank">الهوية</a>` : ""}
                ${x.cvFile ? `<a href="/api/files/${x.cvFile}?token=${encodeURIComponent(token)}" target="_blank">السيرة</a>` : ""}
                ${x.qualificationFile ? `<a href="/api/files/${x.qualificationFile}?token=${encodeURIComponent(token)}" target="_blank">المؤهل</a>` : ""}
                ${x.experienceFile ? `<a href="/api/files/${x.experienceFile}?token=${encodeURIComponent(token)}" target="_blank">الخبرة</a>` : ""}
              </td>
              <td class="actions"><button class="danger" onclick="removeApp(${x.id})">حذف</button></td>
            </tr>`).join("")}
          </tbody>
        </table>` : `<div class="empty">لا توجد طلبات حتى الآن.</div>`}
      </div>
    </div>`;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function removeApp(id) {
  if(!confirm("هل أنت متأكد من حذف الطلب؟")) return;
  const r = await fetch("/api/applications/" + id, {
    method:"DELETE",
    headers:{Authorization:"Bearer " + token}
  });
  if(r.ok) dashboard();
  else alert("تعذر حذف الطلب.");
}

if(token) dashboard(); else loginPage();
</script>
</body>
</html>
