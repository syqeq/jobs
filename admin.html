<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة إدارة الطلبات | مواسم - سييرا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #0c594f;
      --primary-hover: #09443c;
      --accent: #d4a373;
      --bg: #073b34;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #718096;
      --border: #e2e8f0;
      --danger: #e53e3e;
      --danger-hover: #c53030;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #073b34 0%, #0c594f 100%);
      min-height: 100vh;
      padding: 30px 15px;
      color: var(--text);
    }

    .container {
      max-width: 1550px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .header {
      background: #ffffff;
      padding: 22px 30px;
      border-bottom: 3px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-title h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-excel { background: #059669; color: white; }
    .btn-excel:hover { background: #047857; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 15px 30px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .stat-card {
      background: white;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .stat-card .num {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-card .label {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .controls-bar {
      padding: 15px 30px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input,
    .filter-box select {
      width: 100%;
      padding: 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-size: 13.5px;
      background: #f8fafc;
    }

    .table-container {
      padding: 15px 30px 30px;
      overflow-x: auto;
      max-height: 700px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th {
      background: #f1f5f9;
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
      padding: 12px 10px;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 50px;
      font-size: 11.5px;
      font-weight: 700;
      background: #e6fffa;
      color: #0c594f;
      border: 1px solid #b2f5ea;
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      background: #e0f2fe;
      color: #0284c7;
      transition: 0.2s;
    }

    .file-badge:hover {
      background: #0284c7;
      color: #fff;
    }

    .btn-delete {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      transition: 0.2s;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    .empty-file {
      color: #cbd5e1;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="header-title">
        <h1>لوحة إدارة ومعالجة الطلبات</h1>
        <p>بوابة توظيف مواسم - مجموعة سييرا</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="loadData()">تحديث القائمة</button>
        <button class="btn btn-excel" onclick="exportToCSV()">تصدير كملف Excel</button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="num" id="totalCount">0</div>
        <div class="label">إجمالي الطلبات المستلمة</div>
      </div>
      <div class="stat-card">
        <div class="num" id="todayCount">0</div>
        <div class="label">طلبات اليوم</div>
      </div>
    </div>

    <div class="controls-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="بحث بالاسم، رقم الهوية، أو الجوال..." oninput="filterData()" />
      </div>
      <div class="filter-box">
        <select id="jobFilter" onchange="filterData()">
          <option value="">جميع المسارات</option>
          <option value="مسار القادة">مسار القادة</option>
          <option value="مسار الأمن والسلامة">مسار الأمن والسلامة</option>
          <option value="مسار الإسكان والإيواء">مسار الإسكان والإيواء</option>
          <option value="مسار الإعاشة">مسار الإعاشة</option>
          <option value="مسار التجهيز والاستعداد المسبق">مسار التجهيز والاستعداد المسبق</option>
          <option value="مسار التفويج">مسار التفويج</option>
          <option value="مسار النقل">مسار النقل</option>
          <option value="مسار خدمات المشاعر">مسار خدمات المشاعر</option>
          <option value="مسار خدمة العملاء">مسار خدمة العملاء</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>الاسم الرباعي</th>
            <th>المسار المطلوب</th>
            <th>رقم الهوية / الإقامة</th>
            <th>الجوال</th>
            <th>المدينة</th>
            <th>المؤهل</th>
            <th>التخصص</th>
            <th>الهوية</th>
            <th>السيرة الذاتية</th>
            <th>الوثيقة / المؤهل</th>
            <th>شهادة الخبرة</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="13" style="text-align:center; padding: 25px;">جاري تحميل البيانات...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let rawApplications = [];

    async function loadData() {
      try {
        const res = await fetch("/api/admin/applications");
        if (!res.ok) throw new Error("تعذر جلب البيانات");

        rawApplications = await res.json();
        document.getElementById("totalCount").innerText = rawApplications.length;

        const todayStr = new Date().toISOString().split("T")[0];
        const todayCount = rawApplications.filter(a => a.created_at && a.created_at.startsWith(todayStr)).length;
        document.getElementById("todayCount").innerText = todayCount;

        filterData();
      } catch (err) {
        document.getElementById("tableBody").innerHTML = `<tr><td colspan="13" style="text-align:center; color:red; padding: 25px;">تعذر الاتصال بقاعدة البيانات.</td></tr>`;
      }
    }

    function filterData() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const job = document.getElementById("jobFilter").value;

      const filtered = rawApplications.filter(item => {
        const matchQ = !q || (item.full_name && item.full_name.toLowerCase().includes(q)) ||
                              (item.id_number && item.id_number.includes(q)) ||
                              (item.phone && item.phone.includes(q));
        const matchJob = !job || item.job === job;
        return matchQ && matchJob;
      });

      renderRows(filtered);
    }

    function renderRows(items) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="13" style="text-align:center; padding: 30px; color:#a0aec0;">لا توجد أي نتائج مطابقة.</td></tr>`;
        return;
      }

      items.forEach((item, index) => {
        const getLink = (f, title) => {
          if (!f) return `<span class="empty-file">-</span>`;
          const href = f.startsWith("http") ? f : `/api/uploads/${f}`;
          return `<a class="file-badge" href="${href}" target="_blank">${title}</a>`;
        };

        const idLink = getLink(item.id_file, "عرض الهوية");
        const cvLink = getLink(item.cv_file, "عرض السيرة");
        const qualLink = getLink(item.qualification_file, "عرض المؤهل");
        const expLink = getLink(item.experience_file, "عرض الخبرة");

        tbody.innerHTML += `
          <tr id="row-${item.id}">
            <td>${index + 1}</td>
            <td><strong>${item.full_name || "-"}</strong></td>
            <td><span class="badge">${item.job || "-"}</span></td>
            <td>${item.id_number || "-"}</td>
            <td>${item.phone || "-"}</td>
            <td>${item.city || "-"}</td>
            <td>${item.education || "-"}</td>
            <td>${item.major || "بدون"}</td>
            <td>${idLink}</td>
            <td>${cvLink}</td>
            <td>${qualLink}</td>
            <td>${expLink}</td>
            <td>
              <button class="btn-delete" onclick="deleteApp('${item.id}')">حذف</button>
            </td>
          </tr>
        `;
      });
    }

    async function deleteApp(id) {
      if (!confirm("هل أنت متأكد من رغبتك في حذف هذا الطلب نهائياً؟")) return;

      try {
        const res = await fetch(`/api/admin/applications/${id}`, {
          method: "DELETE"
        });

        if (!res.ok) throw new Error("فشل الحذف");

        // إزالة العنصر محلياً
        rawApplications = rawApplications.filter(a => a.id !== id);
        document.getElementById("totalCount").innerText = rawApplications.length;
        filterData();
      } catch (e) {
        alert("حدث خطأ أثناء محاولة حذف الطلب.");
        console.error(e);
      }
    }

    function exportToCSV() {
      if (!rawApplications.length) return alert("لا توجد بيانات لتصديرها");
      let csv = "\uFEFFالاسم,المسار,الهوية,الجوال,البريد,المدينة,المؤهل,التخصص,الخبرة\n";
      rawApplications.forEach(r => {
        csv += `"${r.full_name}","${r.job}","${r.id_number}","${r.phone}","${r.email}","${r.city}","${r.education}","${r.major}","${r.experience}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Almosafer_Applications_${Date.now()}.csv`;
      a.click();
    }

    loadData();
  </script>
</body>
</html>
