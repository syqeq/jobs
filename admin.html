<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة إدارة الطلبات | مواسم - سييرا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --primary: #0c594f;
      --primary-hover: #09443c;
      --bg: #073b34;
      --card-bg: #ffffff;
      --text: #2d3748;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #073b34 0%, #0c594f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      color: var(--text);
    }

    .dashboard-container {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
    }

    .dash-header h2 {
      color: var(--primary);
      font-size: 24px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      border: none;
      transition: 0.2s;
    }

    .export-btn {
      background: #059669;
      color: white;
    }

    .refresh-btn {
      background: var(--primary);
      color: white;
    }

    .table-wrapper {
      overflow-x: auto;
      max-height: 650px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      color: var(--primary);
      font-weight: 700;
      position: sticky;
      top: 0;
    }

    .btn-link {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }

    .btn-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="dash-header">
      <h2>الطلبات المستلمة (<span id="totalCount">0</span>)</h2>
      <div class="actions">
        <button class="btn refresh-btn" onclick="loadData()">تحديث البيانات</button>
        <button class="btn export-btn" onclick="exportToCSV()">تصدير Excel</button>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>الاسم الرباعي</th>
            <th>المسار المطلوب</th>
            <th>رقم الهوية / الإقامة</th>
            <th>الجوال</th>
            <th>المدينة</th>
            <th>المؤهل</th>
            <th>الهوية</th>
            <th>السيرة الذاتية</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="9" style="text-align:center; padding: 25px;">جاري تحميل البيانات...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let appData = [];

    async function loadData() {
      try {
        const res = await fetch("/api/admin/applications");
        if (!res.ok) throw new Error("تعذر جلب البيانات");
        
        appData = await res.json();
        document.getElementById("totalCount").innerText = appData.length;
        renderRows(appData);
      } catch (err) {
        document.getElementById("tableBody").innerHTML = `<tr><td colspan="9" style="text-align:center; color:red; padding: 20px;">تعذر الاتصال بقاعدة البيانات.</td></tr>`;
        console.error(err);
      }
    }

    function renderRows(items) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 25px;">لا توجد أي طلبات مقدمة حتى الآن.</td></tr>`;
        return;
      }

      items.forEach((item, index) => {
        const idLink = item.id_file ? `<a class="btn-link" href="/api/uploads/${item.id_file}" target="_blank">عرض</a>` : "-";
        const cvLink = item.cv_file ? `<a class="btn-link" href="/api/uploads/${item.cv_file}" target="_blank">عرض</a>` : "-";

        tbody.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${item.full_name || "-"}</strong></td>
            <td>${item.job || "-"}</td>
            <td>${item.id_number || "-"}</td>
            <td>${item.phone || "-"}</td>
            <td>${item.city || "-"}</td>
            <td>${item.education || "-"}</td>
            <td>${idLink}</td>
            <td>${cvLink}</td>
          </tr>
        `;
      });
    }

    function exportToCSV() {
      if (!appData.length) return alert("لا توجد بيانات لتصديرها");
      let csv = "\uFEFFالاسم,المسار,الهوية,الجوال,البريد,المدينة,المؤهل\n";
      appData.forEach(r => {
        csv += `"${r.full_name}","${r.job}","${r.id_number}","${r.phone}","${r.email}","${r.city}","${r.education}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `applications_${Date.now()}.csv`;
      a.click();
    }

    // تشغيل تلقائي فور فتح الصفحة
    loadData();
  </script>
</body>
</html>
