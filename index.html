<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة التوظيف الموحدة | مواسم - سيرا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #0c594f;
      --primary-hover: #09443c;
      --accent: #d4a373;
      --bg: #073b34;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #718096;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #073b34 0%, #0c594f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: #ffffff;
      padding: 35px 30px 20px;
      text-align: center;
      border-bottom: 3px solid var(--primary);
    }

    .header-logo {
      width: 210px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 15px auto;
      display: block;
      object-fit: contain;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-wrapper {
      padding: 35px 40px;
    }

    .form-section {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px solid var(--border);
    }

    .form-section:last-of-type {
      border-bottom: none;
      margin-bottom: 15px;
      padding-bottom: 0;
    }

    .form-section h2 {
      font-size: 18px;
      color: var(--primary);
      margin-bottom: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: -10px;
      margin-bottom: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 768px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
      .form-wrapper {
        padding: 25px 20px;
      }
    }

    .input-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #374151;
    }

    .input-group .req {
      color: #e53e3e;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #f8fafc;
      color: #1a202c;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--primary);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(12, 89, 79, 0.15);
    }

    .file-group {
      position: relative;
    }

    .file-group input[type="file"] {
      display: none;
    }

    .file-label {
      display: block;
      padding: 14px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      text-align: center;
      background: #f8fafc;
      color: #64748b;
      cursor: pointer;
      font-weight: 500;
      font-size: 13.5px;
      transition: all 0.2s ease;
    }

    .file-label:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #f0fdfa;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      margin-top: 15px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(12, 89, 79, 0.25);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert-box {
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .alert-success {
      background: #def7ec;
      color: #03543f;
      border: 1px solid #bcf0da;
    }

    .alert-error {
      background: #fde8e8;
      color: #9b1c1c;
      border: 1px solid #f8b4b4;
    }

    .footer {
      text-align: center;
      padding: 18px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="https://i.ibb.co/pB9Xg1vL/WhatsApp-Image-2026-08-24-at-8-39-12-PM.jpeg" alt="شعار مجموعة سيرا ومواسم" class="header-logo" />
      <h1>بوابة التوظيف الموحدة</h1>
      <p>شركة مجموعة سيرا القابضة</p>
    </header>

    <main class="form-wrapper">
      <div id="messageBox" class="alert-box" style="display: none;"></div>

      <form id="jobApplicationForm" enctype="multipart/form-data">
        <!-- المسار الوظيفي -->
        <div class="form-section">
          <h2>1. المسار الوظيفي</h2>
          <div class="input-group">
            <label for="job">المسار المطلوب <span class="req">*</span></label>
            <select id="job" name="job" required>
              <option value="" disabled selected>اختر المسار المتقدم إليه...</option>
              <option value="مسار بطائق نُسك">مسار بطائق نُسك</option>
              <option value="مسار الأمن والسلامة">مسار الأمن والسلامة</option>
              <option value="مسار الإسكان والإيواء">مسار الإسكان والإيواء</option>
              <option value="مسار الإعاشة">مسار الإعاشة</option>
              <option value="مسار التجهيز والاستعداد المسبق">مسار التجهيز والاستعداد المسبق</option>
              <option value="مسار التفويج">مسار التفويج</option>
              <option value="مسار القادة">مسار القادة</option>
              <option value="مسار النقل">مسار النقل</option>
              <option value="مسار خدمات المشاعر">مسار خدمات المشاعر</option>
              <option value="مسار خدمة العملاء">مسار خدمة العملاء</option>
            </select>
          </div>
        </div>

        <!-- البيانات الشخصية -->
        <div class="form-section">
          <h2>2. البيانات الشخصية</h2>
          <div class="grid-2">
            <div class="input-group">
              <label for="fullName">الاسم الرباعي <span class="req">*</span></label>
              <input type="text" id="fullName" name="fullName" placeholder="الاسم كما هو مدون في الهوية" required />
            </div>

            <div class="input-group">
              <label for="idNumber">رقم الهوية الوطنية / الإقامة <span class="req">*</span></label>
              <input type="text" id="idNumber" name="idNumber" maxlength="10" placeholder="10 أرقام" required />
            </div>
          </div>

          <div class="grid-3">
            <div class="input-group">
              <label for="birthDate">تاريخ الميلاد <span class="req">*</span></label>
              <input type="date" id="birthDate" name="birthDate" required />
            </div>

            <div class="input-group">
              <label for="gender">الجنس <span class="req">*</span></label>
              <select id="gender" name="gender" required>
                <option value="" disabled selected>اختر الجنس...</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
              </select>
            </div>

            <div class="input-group">
              <label for="nationality">الجنسية <span class="req">*</span></label>
              <select id="nationality" name="nationality" required>
                <option value="" disabled selected>اختر الجنسية...</option>
                <option value="سعودي">سعودي</option>
                <option value="مصري">مصري</option>
                <option value="سوداني">سوداني</option>
                <option value="يمني">يمني</option>
                <option value="أردني">أردني</option>
                <option value="سوري">سوري</option>
                <option value="باكستاني">باكستاني</option>
                <option value="هندي">هندي</option>
                <option value="بنغلاديشي">بنغلاديشي</option>
                <option value="إندونيسي">إندونيسي</option>
                <option value="أخرى">أخرى</option>
              </select>
            </div>
          </div>
        </div>

        <!-- بيانات التواصل ومكان الإقامة -->
        <div class="form-section">
          <h2>3. التواصل ومكان الإقامة</h2>
          <div class="grid-3">
            <div class="input-group">
              <label for="phone">رقم الجوال <span class="req">*</span></label>
              <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" maxlength="10" required />
            </div>

            <div class="input-group">
              <label for="email">البريد الإلكتروني <span class="req">*</span></label>
              <input type="email" id="email" name="email" placeholder="example@email.com" required />
            </div>

            <div class="input-group">
              <label for="city">مدينة الإقامة <span class="req">*</span></label>
              <select id="city" name="city" required>
                <option value="" disabled selected>-- اختر --</option>
                <option value="الرياض">الرياض</option>
                <option value="جدة">جدة</option>
                <option value="مكة المكرمة">مكة المكرمة</option>
                <option value="المدينة المنورة">المدينة المنورة</option>
                <option value="الدمام">الدمام</option>
                <option value="الخبر">الخبر</option>
                <option value="أبها">أبها</option>
                <option value="تبوك">تبوك</option>
                <option value="القصيم">القصيم</option>
                <option value="أخرى">أخرى</option>
              </select>
            </div>
          </div>
        </div>

        <!-- المؤهلات والخبرات -->
        <div class="form-section">
          <h2>4. المؤهلات والخبرات</h2>
          <div class="grid-2">
            <div class="input-group">
              <label for="education">المؤهل التعليمي <span class="req">*</span></label>
              <select id="education" name="education" required>
                <option value="" disabled selected>اختر المؤهل التعليمي...</option>
                <option value="ابتدائي">ابتدائي</option>
                <option value="متوسط">متوسط</option>
                <option value="ثانوي">ثانوي</option>
                <option value="دبلوم">دبلوم</option>
                <option value="بكالوريوس">بكالوريوس</option>
                <option value="ماجستير">ماجستير</option>
                <option value="دكتوراه">دكتوراه</option>
              </select>
            </div>

            <div class="input-group">
              <label for="major">التخصص الأكاديمي (إن وجد)</label>
              <input type="text" id="major" name="major" placeholder="مثال: إدارة، أمن وسلامة، لغات" />
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group">
              <label for="experience">سنوات الخبرة العملية</label>
              <input type="number" id="experience" name="experience" min="0" max="40" placeholder="0 في حال عدم وجود خبرة سابقة" />
            </div>

            <div class="input-group">
              <label for="languages">اللغات المتقنة</label>
              <input type="text" id="languages" name="languages" placeholder="مثال: العربية، الإنجليزية، الأردية" />
            </div>
          </div>
        </div>

        <!-- المرفقات والمستندات -->
        <div class="form-section">
          <h2>5. المستندات والمرفقات الرسمية</h2>
          <p class="section-desc">الصيغ المسموحة: PDF، JPG، PNG (الحد الأقصى 10 ميجابايت لكل ملف)</p>
          
          <div class="grid-2">
            <div class="input-group file-group">
              <label>صورة الهوية الوطنية / الإقامة <span class="req">*</span></label>
              <input type="file" id="idFile" name="idFile" accept=".pdf,image/jpeg,image/png" required />
              <label for="idFile" class="file-label">اختر ملف الهوية...</label>
            </div>

            <div class="input-group file-group">
              <label>السيرة الذاتية (CV)</label>
              <input type="file" id="cvFile" name="cvFile" accept=".pdf,image/jpeg,image/png" />
              <label for="cvFile" class="file-label">اختر ملف السيرة الذاتية...</label>
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group file-group">
              <label>وثيقة التخرج / المؤهل التعليمي</label>
              <input type="file" id="qualificationFile" name="qualificationFile" accept=".pdf,image/jpeg,image/png" />
              <label for="qualificationFile" class="file-label">اختر وثيقة المؤهل...</label>
            </div>

            <div class="input-group file-group">
              <label>رخصة المسار</label>
              <input type="file" id="experienceFile" name="experienceFile" accept=".pdf,image/jpeg,image/png" />
              <label for="experienceFile" class="file-label">اختر ملف رخصة المسار...</label>
            </div>
          </div>
        </div>

        <!-- زر الإرسال -->
        <div class="submit-wrapper">
          <button type="submit" id="submitBtn" class="btn-submit">
            <span id="btnSpinner" class="spinner" style="display: none;"></span>
            <span id="btnText">إرسال الطلب</span>
          </button>
        </div>
      </form>
    </main>

    <footer class="footer">
      <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>
  </div>

  <script src="./script.js"></script>
</body>
</html>
