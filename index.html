<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة التوظيف الموحدة | المسافر</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-area">
        <h1>بوابة التوظيف الموحدة</h1>
        <p>انضم إلى فريق العمل المتميز وشاركنا مسيرة النجاح</p>
      </div>
    </header>

    <main class="form-wrapper">
      <div id="messageBox" class="alert-box" style="display: none;"></div>

      <form id="jobApplicationForm" enctype="multipart/form-data">
        <!-- المسار الوظيفي -->
        <div class="form-section">
          <h2>1. المسار الوظيفي</h2>
          <div class="input-group">
            <label for="job">الوظيفة المطلوبة <span class="req">*</span></label>
            <select id="job" name="job" required>
              <option value="" disabled selected>اختر الوظيفة المتقدم إليها...</option>
              <option value="خدمة عملاء">خدمة عملاء (Customer Service)</option>
              <option value="مبيعات سياحية">مبيعات وتذاكر (Travel Consultant)</option>
              <option value="تقنية معلومات وأمن سيبراني">تقنية معلومات وأمن سيبراني (IT & Cybersecurity)</option>
              <option value="محاسبة ومالية">محاسبة وإدارة مالية (Accounting & Finance)</option>
              <option value="تسويق رقمي">تسويق رقمي وصناعة محتوى (Digital Marketing)</option>
              <option value="إدارة عمليات وموارد بشرية">موارد بشرية وعمليات (HR & Operations)</option>
            </select>
          </div>
        </div>

        <!-- البيانات الشخصية -->
        <div class="form-section">
          <h2>2. البيانات الشخصية</h2>
          <div class="grid-2">
            <div class="input-group">
              <label for="fullName">الاسم الرباعي <span class="req">*</span></label>
              <input type="text" id="fullName" name="fullName" placeholder="الاسم كما هو مدون في الهوية" required />
            </div>

            <div class="input-group">
              <label for="idNumber">رقم الهوية الوطنية / الإقامة <span class="req">*</span></label>
              <input type="text" id="idNumber" name="idNumber" maxlength="10" placeholder="10 أرقام" required />
            </div>
          </div>

          <div class="grid-3">
            <div class="input-group">
              <label for="birthDate">تاريخ الميلاد <span class="req">*</span></label>
              <input type="date" id="birthDate" name="birthDate" required />
            </div>

            <div class="input-group">
              <label for="gender">الجنس <span class="req">*</span></label>
              <select id="gender" name="gender" required>
                <option value="" disabled selected>اختر الجنس...</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
              </select>
            </div>

            <div class="input-group">
              <label for="nationality">الجنسية <span class="req">*</span></label>
              <input type="text" id="nationality" name="nationality" placeholder="مثال: سعودي" required />
            </div>
          </div>
        </div>

        <!-- بيانات التواصل والإقامة -->
        <div class="form-section">
          <h2>3. التواصل ومكان الإقامة</h2>
          <div class="grid-3">
            <div class="input-group">
              <label for="phone">رقم الجوال <span class="req">*</span></label>
              <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" maxlength="10" required />
            </div>

            <div class="input-group">
              <label for="email">البريد الإلكتروني <span class="req">*</span></label>
              <input type="email" id="email" name="email" placeholder="example@email.com" required />
            </div>

            <div class="input-group">
              <label for="city">مدينة الإقامة الحالية <span class="req">*</span></label>
              <input type="text" id="city" name="city" placeholder="مثال: جدة، الرياض" required />
            </div>
          </div>
        </div>

        <!-- المؤهلات والخبرات -->
        <div class="form-section">
          <h2>4. المؤهلات والخبرات</h2>
          <div class="grid-2">
            <div class="input-group">
              <label for="education">المؤهل التعليمي <span class="req">*</span></label>
              <select id="education" name="education" required>
                <option value="" disabled selected>اختر أعلى مؤهل تعليمي...</option>
                <option value="ثانوي">ثانوية عامة</option>
                <option value="دبلوم">دبلوم</option>
                <option value="بكالوريوس">بكالوريوس</option>
                <option value="ماجستير">ماجستير</option>
                <option value="دكتوراه">دكتوراه</option>
              </select>
            </div>

            <div class="input-group">
              <label for="major">التخصص الأكاديمي</label>
              <input type="text" id="major" name="major" placeholder="مثال: نظم معلومات، إدارة أعمال" />
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group">
              <label for="experience">سنوات الخبرة العملية</label>
              <input type="number" id="experience" name="experience" min="0" max="40" placeholder="0 في حال كنت خريجاً حديثاً" />
            </div>

            <div class="input-group">
              <label for="languages">اللغات المتقنة</label>
              <input type="text" id="languages" name="languages" placeholder="مثال: العربية، الإنجليزية" />
            </div>
          </div>
        </div>

        <!-- المرفقات والمستندات -->
        <div class="form-section">
          <h2>5. المستندات والمرفقات الرسمية</h2>
          <p class="section-desc">الصيغ المسموحة: PDF، JPG، PNG (الحد الأقصى 10 ميجابايت لكل ملف)</p>
          
          <div class="grid-2">
            <div class="input-group file-group">
              <label>صورة الهوية الوطنية / الإقامة <span class="req">*</span></label>
              <input type="file" id="idFile" name="idFile" accept=".pdf,image/jpeg,image/png" required />
              <label for="idFile" class="file-label">اختر ملف الهوية...</label>
            </div>

            <div class="input-group file-group">
              <label>السيرة الذاتية (CV)</label>
              <input type="file" id="cvFile" name="cvFile" accept=".pdf,image/jpeg,image/png" />
              <label for="cvFile" class="file-label">اختر ملف السيرة الذاتية...</label>
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group file-group">
              <label>وثيقة التخرج / الشهادة الأكاديمية</label>
              <input type="file" id="qualificationFile" name="qualificationFile" accept=".pdf,image/jpeg,image/png" />
              <label for="qualificationFile" class="file-label">اختر وثيقة التخرج...</label>
            </div>

            <div class="input-group file-group">
              <label>شهادات الخبرة / الدورات</label>
              <input type="file" id="experienceFile" name="experienceFile" accept=".pdf,image/jpeg,image/png" />
              <label for="experienceFile" class="file-label">اختر شهادات الخبرة...</label>
            </div>
          </div>
        </div>

        <!-- زر الإرسال -->
        <div class="submit-wrapper">
          <button type="submit" id="submitBtn" class="btn-submit">
            <span id="btnSpinner" class="spinner" style="display: none;"></span>
            <span id="btnText">إرسال الطلب</span>
          </button>
        </div>
      </form>
    </main>

    <footer class="footer">
      <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
